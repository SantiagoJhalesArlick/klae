    <!-- Minimal Vanilla JS for vCard Generation & Interactive Polish -->
    <script>
        /**
         * Justine Claire Francia's pre-configured contact details.
         */
        const CONTACT_INFO = {
            firstName: "Justine Claire",
            lastName: "Francia",
            fullName: "Justine Claire Francia",
            title: "4th Year BS Accountancy",
            phone: "+639708617082",
            email: "franciajustineclaire@gmail.com",
            facebook: "https://www.facebook.com/klarahriii",
            instagram: "https://www.instagram.com/claaaaair_?fqnt=MXR6c2ptd3NmczRjbA%3D%3D&utm_source=qr",
            tiktok: "https://www.tiktok.com/@klrhr?_r=1&_t=ZS-9BfwRa5u8sG",
            note: "Araw araw sipag lang - 4th Year BSA"
        };

        /**
         * Displays a subtle status message inside the card instead of using alert().
         */
        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = message;
            toast.classList.remove('hidden');
            
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3200);
        }

        /**
         * Dynamically builds a standard vCard (.vcf) file and triggers a download
         * so phones immediately prompt "Add to Contacts".
         */
        function downloadVCard() {
            try {
                const vcardLines = [
                    "BEGIN:VCARD",
                    "VERSION:3.0",
                    `N:${CONTACT_INFO.lastName};${CONTACT_INFO.firstName};;;`,
                    `FN:${CONTACT_INFO.fullName}`,
                    `TITLE:${CONTACT_INFO.title}`,
                    `TEL;TYPE=CELL,VOICE:${CONTACT_INFO.phone}`,
                    `EMAIL;TYPE=PREF,INTERNET:${CONTACT_INFO.email}`,
                    `URL;TYPE=Facebook:${CONTACT_INFO.facebook}`,
                    `URL;TYPE=Instagram:${CONTACT_INFO.instagram}`,
                    `URL;TYPE=TikTok:${CONTACT_INFO.tiktok}`,
                    `NOTE:${CONTACT_INFO.note}`,
                    "END:VCARD"
                ];

                const vcardBlob = new Blob([vcardLines.join("\r\n")], { type: "text/vcard;charset=utf-8" });
                const blobUrl = URL.createObjectURL(vcardBlob);

                const tempLink = document.createElement("a");
                tempLink.href = blobUrl;
                tempLink.setAttribute("download", "Justine_Claire_Francia.vcf");
                document.body.appendChild(tempLink);
                tempLink.click();
                document.body.removeChild(tempLink);

                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                showToast("Contact card ready! Open to save to contacts.");
            } catch (error) {
                console.error("vCard generation error:", error);
                showToast("Could not generate contact file. Please try again.");
            }
        }

        /**
         * Helper to copy text to clipboard with a custom toast.
         */
        function copyText(text, successMsg) {
            try {
                const tempInput = document.createElement("textarea");
                tempInput.value = text;
                tempInput.style.position = "fixed";
                tempInput.style.opacity = "0";
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                showToast(successMsg);
            } catch (err) {
                console.error("Copy failed:", err);
                showToast("Unable to copy automatically.");
            }
        }

        /**
         * Copies the current page URL to the clipboard.
         */
        function copyProfileLink() {
            copyText(window.location.href, "Profile link copied to clipboard!");
        }

        /**
         * In-Page Music Player Logic for "Far Away" by Arthur Nery.
         */
        let isPlayerOpen = false;
        let isPlaying = false;
        let hasLocalMp3 = false;

        // Check silently if far-away.mp3 exists in the same folder
        (function checkLocalAudioFile() {
            const audioEl = document.getElementById('localAudioElement');
            if (!audioEl) return;

            fetch('far-away.mp3', { method: 'HEAD' })
                .then(res => {
                    if (res.ok) {
                        hasLocalMp3 = true;
                        document.getElementById('localAudioWrapper').classList.remove('hidden');
                        document.getElementById('embedPlayerWrapper').classList.add('hidden');
                    }
                })
                .catch(() => {
                    hasLocalMp3 = false;
                });

            audioEl.addEventListener('timeupdate', () => {
                if (!audioEl.duration) return;
                const pct = (audioEl.currentTime / audioEl.duration) * 100;
                document.getElementById('audioProgressBar').value = pct;
                document.getElementById('audioCurrentTime').textContent = formatSeconds(audioEl.currentTime);
                document.getElementById('audioDurationTime').textContent = formatSeconds(audioEl.duration);
            });

            audioEl.addEventListener('ended', () => {
                setPlayingVisualState(false);
            });
        })();

        function formatSeconds(sec) {
            const mins = Math.floor(sec / 60);
            const secs = Math.floor(sec % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function seekLocalAudio(percent) {
            const audioEl = document.getElementById('localAudioElement');
            if (audioEl && audioEl.duration) {
                audioEl.currentTime = (percent / 100) * audioEl.duration;
            }
        }

        function setPlayingVisualState(playing) {
            isPlaying = playing;
            const playSvg = document.getElementById('playIconSvg');
            const pauseSvg = document.getElementById('pauseIconSvg');
            const eqContainer = document.getElementById('eqBarsContainer');
            const bars = eqContainer.querySelectorAll('span');
            const statusLabel = document.getElementById('musicStatusLabel');
            const actionPill = document.getElementById('musicActionPill');

            if (playing) {
                playSvg.classList.add('hidden');
                pauseSvg.classList.remove('hidden');
                eqContainer.classList.remove('opacity-40');
                bars[0].classList.add('eq-bar-1');
                bars[1].classList.add('eq-bar-2');
                bars[2].classList.add('eq-bar-3');
                statusLabel.textContent = "Now Playing";
                actionPill.textContent = hasLocalMp3 ? "Pause" : "Hide";
            } else {
                playSvg.classList.remove('hidden');
                pauseSvg.classList.add('hidden');
                eqContainer.classList.add('opacity-40');
                bars[0].classList.remove('eq-bar-1');
                bars[1].classList.remove('eq-bar-2');
                bars[2].classList.remove('eq-bar-3');
                statusLabel.textContent = "Tap to Play";
                actionPill.textContent = "Play";
            }
        }

        function toggleMusicPlayer() {
            const drawer = document.getElementById('inPagePlayerDrawer');
            const toggleBtn = document.getElementById('musicToggleBtn');
            const iframe = document.getElementById('inPageMusicIframe');
            const audioEl = document.getElementById('localAudioElement');

            if (hasLocalMp3) {
                if (!isPlayerOpen) {
                    drawer.classList.remove('hidden');
                    isPlayerOpen = true;
                    toggleBtn.setAttribute('aria-expanded', 'true');
                }
                if (audioEl.paused) {
                    audioEl.play().then(() => setPlayingVisualState(true)).catch(() => {
                        showToast("Tap play again to start audio.");
                    });
                } else {
                    audioEl.pause();
                    setPlayingVisualState(false);
                }
                return;
            }

            // Official In-Page Player for "Far Away" by Arthur Nery
            if (!isPlayerOpen) {
                drawer.classList.remove('hidden');
                if (!iframe.src || iframe.src === window.location.href) {
                    iframe.src = "https://www.youtube-nocookie.com/embed/0C7OHYIXZnU?autoplay=1";
                }
                isPlayerOpen = true;
                toggleBtn.setAttribute('aria-expanded', 'true');
                setPlayingVisualState(true);
            } else {
                drawer.classList.add('hidden');
                iframe.src = "";
                isPlayerOpen = false;
                toggleBtn.setAttribute('aria-expanded', 'false');
                setPlayingVisualState(false);
            }
        }
    </script>
</body>
</html>
